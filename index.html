<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>T&T Rewards Card Maintenance (Canada)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
    }

    .layout-container {
      display: flex;
      align-items: flex-start;
      gap: 40px;
    }

    .container {
      background: #fff;
      padding: 20px;
      border: 1px solid #ccc;
      flex: 2;
      max-width: 700px;
      position: relative;
    }

    .image-box {
      flex: 1;
    }

    .image-box img {
      max-width: 100%;
      max-height: 615px;
      height: auto;
      display: block;
      border: 1px solid #ccc;
    }

    .form-row {
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 10px;
    }

    .form-row label {
      width: 160px;
      flex-shrink: 0;
    }

    input[type="text"], select {
      padding: 5px;
    }

    .long-input { width: 20ch; }
    .name-input { width: 30ch; }
    .phone-input { width: 20ch; }
    .postal-input { width: 6ch; }
    .short-input { width: 10ch; }
    .email-user { width: 18ch; }
    .email-domain { width: 10ch; }
    .email-tld { width: 5ch; }

    .grouped-inputs {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .language-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px 5px;
    }

    .top-buttons {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .top-buttons button {
      padding: 6px 16px;
      margin-left: 10px;
    }

    .required::after {
      content: "*";
      color: red;
      margin-left: 4px;
    }

    .language-options label {
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="layout-container">
  <div class="container">
    <div class="top-buttons">
      <button type="button" onclick="validateForm()">Save</button>
      <button type="button" onclick="confirmDelete()">Delete</button>
    </div>

    <h2>T&T Rewards Card Maintenance (Canada)</h2>

    <form id="ttForm">
      <div class="form-row">
        <label class="required">Card No.:</label>
        <div class="grouped-inputs">
          <input type="text" name="card_prefix" maxlength="5" placeholder="e.g. 40102" class="short-input" required>
          <input type="text" name="card_number" maxlength="8" placeholder="Member number" class="long-input" required>
        </div>
      </div>

      <div class="form-row">
        <label class="required">First Name:</label>
        <input type="text" name="first_name" placeholder="e.g. Chris" class="name-input" required>
      </div>

      <div class="form-row">
        <label class="required">Last Name:</label>
        <input type="text" name="last_name" placeholder="e.g. Leung" class="name-input" required>
      </div>

      <div class="form-row">
        <label class="required">Email:</label>
        <div class="grouped-inputs">
          <input type="text" name="email_prefix" placeholder="e.g. chris.leung" class="email-user" required> @
          <input type="text" name="email_domain" placeholder="e.g. gmail" class="email-domain" required> .
          <input type="text" name="email_tld" placeholder="com" class="email-tld" required>
        </div>
      </div>

      <div class="form-row">
        <label class="required">Subscribe E-newsletter:</label>
        <div class="grouped-inputs">
          <label><input type="checkbox" name="subscribe_newsletter" value="yes" onclick="enforceSingleCheckbox(this, 'subscribe_newsletter')"> Yes</label>
          <label><input type="checkbox" name="subscribe_newsletter" value="no" onclick="enforceSingleCheckbox(this, 'subscribe_newsletter')"> No</label>
        </div>
      </div>

      <div class="form-row">
        <label class="required">Phone:</label>
        <input type="text" name="phone" maxlength="10" placeholder="e.g. 9999999999" class="phone-input" required>
      </div>

      <div class="form-row">
        <label>Postal Code:</label>
        <div class="grouped-inputs">
          <input type="text" name="postal1" maxlength="3" placeholder="A9A" class="postal-input">
          <input type="text" name="postal2" maxlength="3" placeholder="9A9" class="postal-input">
        </div>
      </div>

      <div class="form-row">
        <label>Language:</label>
        <div class="language-options">
          <label><input type="checkbox" name="language" value="EN" onclick="enforceSingleCheckbox(this, 'language')"> English</label>
          <label><input type="checkbox" name="language" value="TC" onclick="enforceSingleCheckbox(this, 'language')"> Traditional Chinese</label>
          <label><input type="checkbox" name="language" value="SC" onclick="enforceSingleCheckbox(this, 'language')"> Simplified Chinese</label>
          <label><input type="checkbox" name="language" value="FR" onclick="enforceSingleCheckbox(this, 'language')"> French</label>
        </div>
      </div>

      <div class="form-row">
        <label>Date of Birth:</label>
        <div class="grouped-inputs">
          <input type="text" name="birth_month" maxlength="2" placeholder="MM" class="postal-input">
          <input type="text" name="birth_year" maxlength="4" placeholder="YYYY" class="short-input">
        </div>
      </div>

      <div class="form-row">
        <label class="required">Form Submission Date:</label>
        <div class="grouped-inputs">
          <input type="text" name="sub_month" maxlength="2" placeholder="MM" class="postal-input" required>
          <input type="text" name="sub_day" maxlength="2" placeholder="DD" class="postal-input" required>
          <input type="text" name="sub_year" maxlength="4" placeholder="YYYY" class="short-input" required>
        </div>
      </div>

      <div class="form-row">
        <label class="required">Application Signed:</label>
        <div class="grouped-inputs">
          <label><input type="checkbox" name="customer_signed" required> Yes</label>
        </div>
      </div>
    </form>
  </div>

  <div class="image-box">
    <img src="application_form.jpg" alt="Application Form Example">
  </div>
</div>

<script>
  function validateForm() {
    console.log("Validation started");

    const form = document.forms['ttForm'];

    const requiredFields = [
      'card_prefix', 'card_number',
      'first_name', 'last_name',
      'email_prefix', 'email_domain', 'email_tld',
      'phone',
      'sub_month', 'sub_day', 'sub_year'
    ];

    for (let field of requiredFields) {
      if (!form[field].value.trim()) {
        alert("Missing Mandatory Information");
        return;
      }
    }

    if (!form['customer_signed'].checked) {
      alert("Missing Mandatory Information");
      return;
    }

    const newsletterGroup = document.querySelectorAll('input[name="subscribe_newsletter"]');
    if (![...newsletterGroup].some(cb => cb.checked)) {
      alert("Please select Subscribe E-newsletter option");
      return;
    }

    if (!/^\d{5}$/.test(form['card_prefix'].value.trim())) {
      alert("Card prefix must be exactly 5 digits");
      return;
    }

    if (!/^\d{8}$/.test(form['card_number'].value.trim())) {
      alert("Card number must be exactly 8 digits");
      return;
    }

    if (!/^\d{10}$/.test(form['phone'].value.trim())) {
      alert("Phone number must be exactly 10 digits");
      return;
    }

    const postal1 = form['postal1'].value.trim();
    const postal2 = form['postal2'].value.trim();
    if ((postal1 || postal2) &&
        (!/^[A-Za-z]\d[A-Za-z]$/.test(postal1) || !/^\d[A-Za-z]\d$/.test(postal2))) {
      alert("Postal code format is invalid (e.g., A9A 9A9)");
      return;
    }

    const dobMonth = form['birth_month'].value.trim();
    const dobYear = form['birth_year'].value.trim();
    if (dobMonth && (!/^\d{1,2}$/.test(dobMonth) || parseInt(dobMonth) < 1 || parseInt(dobMonth) > 12)) {
      alert("Birth month must be between 1 and 12");
      return;
    }
    if (dobYear && (!/^\d{4}$/.test(dobYear) || parseInt(dobYear) > 2100 || parseInt(dobYear) < 1900)) {
      alert("Birth year must be between 1900 and 2100");
      return;
    }

    const sub_mm = parseInt(form['sub_month'].value.trim(), 10);
    const sub_dd = parseInt(form['sub_day'].value.trim(), 10);
    const sub_yyyy = parseInt(form['sub_year'].value.trim(), 10);

    if (
      isNaN(sub_mm) || sub_mm < 1 || sub_mm > 12 ||
      isNaN(sub_dd) || sub_dd < 1 || sub_dd > 31 ||
      isNaN(sub_yyyy) || sub_yyyy > 2100 || sub_yyyy < 1900
    ) {
      alert("Form submission date is invalid. Please check MM, DD, and YYYY.");
      return;
    }

    alert("Record Saved");
  }

  function confirmDelete() {
    if (confirm("This account will be permanently deleted. Confirm?")) {
      alert("Account Deleted");
    }
  }

  function enforceSingleCheckbox(clicked, groupName) {
    const group = document.querySelectorAll(`input[type="checkbox"][name="${groupName}"]`);
    group.forEach(box => {
      if (box !== clicked) box.checked = false;
    });
  }
</script>

</body>
</html>
